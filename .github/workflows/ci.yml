name: MLOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # 1. Kiểm tra lỗi và unit test
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn về máy ảo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
            frontend
            tests
            requirements-test.txt
          sparse-checkout-cone-mode: false
        
      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt

      - name: Kiểm tra 1 (rà soát lỗi cú pháp)
        run: |
          # Dừng quá trình nếu phát hiện biến rác hoặc lỗi nghiêm trọng
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Đánh giá độ phức tạp và độ dài dòng code (Không dừng quá trình)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Kiểm tra 2 (chạy kiểm thử unit test)
        run: |
          pytest tests/ -v

  docker-build-test:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn về máy ảo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
            frontend
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Thử nghiệm build toàn bộ hệ thống
        run: docker-compose build